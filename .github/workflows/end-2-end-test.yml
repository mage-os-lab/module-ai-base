name: End-2-end

on:
  push:
    branches: [main]
  pull_request:

# No job here writes to the repository; a compromised action or dependency gets a read-only token.
permissions:
  contents: read

jobs:
  # The admin form is a different form depending on the application mode: developer mode offers
  # every registered provider and explains what to install, production offers only the ones that
  # can be used. Both are shipped behaviour, so both are tested.
  #
  # The full cross-product of platform, PHP version and mode is twelve jobs of half an hour, and
  # the extra jobs re-run a suite that does not touch the PHP version at all. The combinations
  # below are chosen instead: each platform is seen in both modes, and the PHP floor, the middle
  # and the newest release each appear at least once. The newest combinations use the `latest`
  # tag and follow new releases by themselves; bump the pinned TAG values when a new Magento,
  # Mage-OS or PHP release is added to magento2-in-a-box.
  #
  # The first entry is the oldest Magento composer.json allows: 2.4.8 (framework 103.0.8). It
  # runs on PHP 8.3 because magento2-in-a-box has no PHP 8.2 image for 2.4.8; the check-extension
  # workflow covers 2.4.8 on PHP 8.2. Raise it together with the magento/framework constraint,
  # never on its own.
  e2e-tests:
    name: E2E (${{ matrix.PLATFORM }}, ${{ matrix.PHP_VERSION }}, ${{ matrix.MAGENTO_MODE }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - PLATFORM: magento2.4.8
            IMAGE: magento-project-community-edition
            PHP_VERSION: php83-fpm
            TAG: php83-fpm-magento2.4.8
            MAGENTO_MODE: production
          - PLATFORM: magento2.4.9
            IMAGE: magento-project-community-edition
            PHP_VERSION: php83-fpm
            TAG: php83-fpm-magento2.4.9
            MAGENTO_MODE: production
          - PLATFORM: magento2.4.9
            IMAGE: magento-project-community-edition
            PHP_VERSION: php84-fpm
            TAG: php84-fpm-magento2.4.9
            MAGENTO_MODE: developer
          # `latest` is the newest Magento release on the newest PHP version magento2-in-a-box
          # builds, so this entry moves forward on its own when either is released.
          - PLATFORM: magento-latest
            IMAGE: magento-project-community-edition
            PHP_VERSION: newest-php
            TAG: latest
            MAGENTO_MODE: production
          - PLATFORM: mage-os3.5.0
            IMAGE: mage-os-community-edition
            PHP_VERSION: php83-fpm
            TAG: php83-fpm-mage-os3.5.0
            MAGENTO_MODE: developer
          # The newest Mage-OS release on the newest PHP version, the same way.
          - PLATFORM: mage-os-latest
            IMAGE: mage-os-community-edition
            PHP_VERSION: newest-php
            TAG: latest
            MAGENTO_MODE: production
    env:
      MAGENTO_MODE: ${{ matrix.MAGENTO_MODE }}
      ADMIN_USER: e2e_admin
      ADMIN_PASSWORD: E2eAdminPassword1
      ADMIN_PATH: admin
      # The suite clears the configured services on every spec. The container is built for this
      # job and thrown away with it, which is the only kind of target that is safe.
      E2E_DISPOSABLE_ENVIRONMENT: '1'
      # The store runs in a container this job drives from outside, so the specs that seed usage
      # rows cannot reach Magento with a plain `php`. These two tell the fixture how to get inside
      # and where the install lives in there; unset, it falls back to running PHP locally, which is
      # what a developer running the suite through DDEV gets.
      E2E_MAGENTO_EXEC: docker exec store
      E2E_MAGENTO_ROOT: /data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Just the container. It serves the store on port 80 itself, so there is no proxy to
      # terminate TLS and therefore no forwarded protocol to get wrong, which is what broke the
      # first version of this job. The store is addressed as localhost because browsers treat it
      # as a secure context, and the Copy button test uses navigator.clipboard, which needs one.
      - name: Start the store container
        run: |
          mkdir -p magento-logs
          docker run -d --name store \
            -p 80:80 \
            -v "$(pwd)/magento-logs:/data/var/log" \
            ghcr.io/controlaltdelete-nl/magento2-in-a-box/${{ matrix.IMAGE }}:${{ matrix.TAG }}

      - name: Upload the module into the container
        run: |
          sed -i '/version/d' ./composer.json
          docker cp $(pwd) store:/data/extensions/
          docker exec store ./install-composer-package mage-os/module-ai-base:@dev

      - name: Enable the module
        run: |
          docker exec store ./retry "php bin/magento module:enable MageOS_AiBase"
          docker exec store ./retry "php bin/magento setup:upgrade --no-interaction --keep-generated"

      # Magento Open Source ships PayPal_Braintree, whose admin script runs on every configuration
      # section and, on 2.4.9, intermittently throws "locations.each is not a function"
      # (PayPal_Braintree/js/system.js:239) while RequireJS is still loading the page. A module
      # factory that throws makes RequireJS abandon the rest of its queue, so on that page load the
      # Save button never gets its widget and the form never submits; the same test saved fine on
      # the loads before it. Nothing here tests Braintree, and Mage-OS does not bundle it, so it
      # goes. Done before di:compile and static deploy so neither has to be redone.
      - name: Disable Braintree, whose admin JavaScript breaks the configuration page at random
        run: |
          docker exec store /bin/bash -c '
            modules=$(bin/magento module:status --enabled | grep -E "^PayPal_Braintree" || true)
            if [ -n "$modules" ]; then
              bin/magento module:disable $modules
            else
              echo "No Braintree modules enabled; nothing to disable."
            fi
          '

      - name: Prepare Magento
        run: |
          docker exec store /bin/bash ./change-base-url http://localhost/
          docker exec store ./retry "bin/magento config:set admin/security/session_lifetime 14400"
          docker exec store ./retry "bin/magento config:set admin/security/admin_account_sharing 1"
          # Magento Open Source loads Adobe's admin analytics and Gainsight PX on every admin page
          # (admin/usage/enabled defaults to on); Mage-OS has no such module. It is the only
          # third-party script on the pages under test, it polls every five seconds and it edits
          # the admin DOM, and the one job that intermittently lost Save clicks was a Magento one.
          # Switching it off takes that variable out of the run. This is not what suppresses the
          # first-login consent modal (a logged answer does that, which UsagePage gives), so both
          # are needed.
          docker exec store ./retry "bin/magento config:set admin/usage/enabled 0"
          docker exec store ./retry "bin/magento admin:user:create \
            --admin-user=${{ env.ADMIN_USER }} \
            --admin-password=${{ env.ADMIN_PASSWORD }} \
            --admin-email=e2e@example.com \
            --admin-firstname=E2E \
            --admin-lastname=Admin"
          docker exec store ./retry "php bin/magento setup:di:compile"
          docker exec store ./retry "php bin/magento setup:static-content:deploy -f"
          docker exec store ./retry "php bin/magento deploy:mode:set ${{ matrix.MAGENTO_MODE }} --skip-compilation"
          docker exec store ./retry "bin/magento cache:flush"

      # Redirects are followed on purpose. An earlier version of this job passed here on the first
      # 302 of a redirect loop, and the loop only surfaced later, in the browser.
      - name: Check that the admin is reachable
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail-with-body --location --max-redirs 5 -s -o /dev/null \
              -w "admin: %{http_code} after %{num_redirects} redirect(s)\n" \
              http://localhost/admin/; then
              exit 0
            fi
            echo "not up yet (attempt $attempt), waiting"
            sleep 5
          done
          echo "The admin never became reachable."
          docker logs store | tail -50
          exit 1

      - name: Install Playwright
        run: |
          cd tests/End-2-End
          npm install
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: |
          cd tests/End-2-End
          BASE_URL="http://localhost/" npx playwright test

      - name: Collect Magento logs
        if: always()
        run: docker logs store > magento.log 2>&1

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.PLATFORM }}-${{ matrix.PHP_VERSION }}-${{ matrix.MAGENTO_MODE }}
          path: |
            tests/End-2-End/test-results
            tests/End-2-End/playwright-report
            magento-logs
            magento.log
